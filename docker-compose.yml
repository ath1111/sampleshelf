services:
  postgres:
    image: postgres:17
    container_name: sampleshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sampleshelf
      POSTGRES_PASSWORD: sampleshelf
      POSTGRES_DB: sampleshelf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sampleshelf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  storage:
    image: rustfs/rustfs:latest
    container_name: sampleshelf-storage
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: sampleshelf
      RUSTFS_SECRET_KEY: sampleshelf-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  redis-data:
  storage-data: