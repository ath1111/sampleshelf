services:
  postgres:
    image: postgres:17
    container_name: sampleshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sampleshelf
      POSTGRES_PASSWORD: sampleshelf
      POSTGRES_DB: sampleshelf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sampleshelf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: